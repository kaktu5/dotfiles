[package]
edition = "2024"
name = "provision"
version = "0.0.0"

[dependencies]

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "debuginfo"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction = { level = "warn", priority = -1 }
