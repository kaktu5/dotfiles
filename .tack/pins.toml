[shorturls]
channel = "https://channels.nixos.org/{path}/nixexprs.tar.zst"
rad = "git+https://rosa.radicle.network/{path}.git"

[all_follow]
# crane = []
fenix = []
nixpkgs = ["nixpkgs-lib"]
rust-overlay = []

[omit_inputs]
names = ["flake-compat", "tack"]

[groups.fetch]
fetch_mode = "build"
type = "fetch"

[inputs]
nixpkgs = { patches = [
  "github:nixos/nixpkgs/pull/562711", # rhythia
], url = "channel:nixos-unstable" }

kaktu5pkgs.url = "rad:z3445hwtrioJCAisuAosBXvcTqVR2"
nf.url = "rad:z3EZi6d3LccUz1s6UmMfuoPJfMdZ"
obsidian-bases-tasks.url = "rad:z4FC12ufxa84RxepxeNMXm5PJUycy"

aagl-gtk-on-nix.url = "github:ezkea/aagl-gtk-on-nix"
affinity-nix.url = "github:mrshmllow/affinity-nix"
cade.url = "github:manic-systems/cade?rev=3211f782a53f94842bbb8782de03a2c5d85c793d" # cade.url = "github:manic-systems/cade"
fenix = { omit_inputs = ["rust-analyzer-src"], url = "github:nix-community/fenix" }
helium-flake.url = "github:amaanq/helium-flake"
hjem.url = "github:feel-co/hjem"
lanzaboote = { omit_inputs = ["pre-commit"], url = "github:nix-community/lanzaboote" }
microvm-nix = { omit_inputs = ["spectrum"], url = "github:microvm-nix/microvm.nix" }
ncro.url = "github:manic-systems/ncro"
nh.url = "github:nix-community/nh"
nix-secrets.url = "github:unnamed-systems/nix-secrets"
nixos-core = { patches = [
  "patches/nixos-core/dont-create-home-dirs.patch",
  "patches/nixos-core/fixes.patch",
], url = "github:manic-systems/nixos-core" }
tack.url = "github:manic-systems/tack"
xdg-utils-nu.url = "github:manic-systems/xdg-utils.nu"

dnscrypt-settings = { type = "fetch", url = "github:quad9dns/dnscrypt-settings" }

license-list-data = { group = "fetch", url = "github:spdx/license-list-data" }
oisd = { group = "fetch", url = "github:sjhgvr/oisd" }
