[shorturls]
channel = "https://channels.nixos.org/{path}/nixexprs.tar.xz"

[all_follow]
crane = []
nixpkgs = ["nixpkgs-lib"]
rust-overlay = []

[inputs]
nixpkgs.url = "channel:nixos-unstable"

nf.url = "github:kaktu5/nf"
nixexprs.url = "github:kaktu5/nixexprs"
preservation.url = "github:kaktu5/preservation"

cade.url = "github:manic-systems/cade"
hjem.url = "github:feel-co/hjem"
lanzaboote.url = "github:nix-community/lanzaboote"
microvm.url = "github:microvm-nix/microvm.nix"
nixos-core.url = "github:kaktu5/nixos-core"            # nixos-core.url = "github:manic-systems/nixos-core"
stash.url = "github:notashelf/stash"
tack.url = "github:manic-systems/tack"
tuigreet.url = "github:notashelf/tuigreet"
vaultix.url = "github:milieuim/vaultix"
xdg-utils-nu.url = "github:manic-systems/xdg-utils.nu"

dnscrypt-settings = {type = "fetch", url = "github:quad9dns/dnscrypt-settings"}
oisd = {type = "fetch", url = "github:sjhgvr/oisd"}
