[shorturls]
channel = "https://channels.nixos.org/{path}/nixexprs.tar.zst"
rad = "git+https://rosa.radicle.network/{path}.git"

[all_follow]
# crane = []
fenix = []
nixpkgs = ["nixpkgs-lib"]
rust-overlay = []

[omit_inputs]
names = ["flake-compat", "tack"]

[groups]
data.type = "fetch"
neovim-opt = { fetch_mode = "build", type = "fetch" }
neovim-start = { fetch_mode = "build", type = "fetch" }
sources.type = "fetch"

[inputs.nixos]
nixpkgs = { patches = [
  "github:nixos/nixpkgs/pull/562711", # rhythia
], url = "channel:nixos-unstable" }

[inputs.firstparty]
obsidian-bases-tasks.url = "rad:z4FC12ufxa84RxepxeNMXm5PJUycy"

[inputs.thirdparty]
affinity-nix.url = "github:mrshmllow/affinity-nix"
alejandra.url = "github:kamadorueda/alejandra"
cade.url = "github:manic-systems/cade"
fenix = { omit_inputs = ["rust-analyzer-src"], url = "github:nix-community/fenix" }
helium-flake.url = "github:amaanq/helium-flake"
hjem.url = "github:feel-co/hjem"
lanzaboote = { omit_inputs = ["pre-commit"], url = "github:nix-community/lanzaboote" }
microvm-nix = { omit_inputs = ["spectrum"], url = "github:microvm-nix/microvm.nix" }
mnw.url = "github:gerg-l/mnw"
ncro.url = "github:manic-systems/ncro"
nh.url = "github:nix-community/nh"
nix-secrets.url = "github:unnamed-systems/nix-secrets"
nixos-core = { patches = ["patches/nixos-core/dont-create-home-dirs.patch"], url = "github:manic-systems/nixos-core" }
override-utils.url = "github:gabriella439/override-utils"
tack.url = "github:manic-systems/tack"
xdg-utils-nu.url = "github:manic-systems/xdg-utils.nu"

[inputs.data]
dnscrypt-settings.url = "github:quad9dns/dnscrypt-settings"
license-list-data.url = "github:spdx/license-list-data"
oisd.url = "github:sjhgvr/oisd"

[inputs.sources]
breezex-cursor = { tag = "v{version}", url = "github:ful1e5/breezex_cursor" }
dwproton-bin = { tag = "dwproton-{version}", type = "fixed", unpack = "tarball", url = "https://dawn.wine/dawn-winery/dwproton/releases/download/dwproton-{version}/dwproton-{version}-x86_64.tar.xz" }
osu-bin = { tag = "{version}-*", type = "fixed", url = "https://github.com/ppy/osu/releases/download/{tag}/osu.AppImage" }
space-mono.url = "github:googlefonts/spacemono"

[inputs.neovim-start]
blink-lib.url = "github:saghen/blink.lib"
canola-nvim.url = "github:barrettruth/canola.nvim/canola"
fidget-nvim = { tag = "v{version}", url = "github:j-hui/fidget.nvim" }
lz-n = { tag = "v{version}", url = "github:lumen-oss/lz.n" }
nvim-web-devicons.url = "github:nvim-tree/nvim-web-devicons"
oxocarbon-nvim.url = "github:nyoom-engineering/oxocarbon.nvim"
plenary-nvim = { tag = "v{version}", url = "github:nvim-lua/plenary.nvim" }

[inputs.neovim-opt]
blink-indent = { tag = "v{version}", url = "github:saghen/blink.indent" }
conform-nvim = { tag = "v{version}", url = "github:stevearc/conform.nvim" }
nvim-colorizer-lua.url = "github:norcalli/nvim-colorizer.lua"
nvim-lint.url = "github:mfussenegger/nvim-lint"
telescope-nvim = { tag = "v{version}", url = "github:nvim-telescope/telescope.nvim" }
